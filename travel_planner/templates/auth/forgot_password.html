{% extends "auth/base_auth.html" %}
{% block title %}Reset Password — VOYA Travel Planner AI{% endblock %}

{% block auth_content %}
<h1 class="auth-card-headline">Reset <em>Password</em></h1>
<p class="auth-card-subtitle">Enter your registered email and we'll send you instructions to recover your account.</p>

<form class="auth-form" method="POST" action="{{ url_for('auth.forgot_password') }}">
  <div class="auth-field">
    <label class="auth-label" for="email">Email</label>
    <div class="auth-input-wrap">
      <span class="auth-input-icon">✉</span>
      <input
        class="auth-input"
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        autofocus
        placeholder="you@example.com"
      />
    </div>
  </div>

  <button class="auth-btn-primary" type="submit">
    <span>Send Reset Link</span>
    <span>→</span>
  </button>
</form>

<div class="auth-footer">
  Remembered your password?
  <a href="{{ url_for('auth.login') }}" class="auth-footer-link">Back to Login</a>
</div>
{% endblock %}
